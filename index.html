<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HungryMap — good food, fast, near you</title>
  <meta name="description" content="Find genuinely good, open-now restaurants near your current location — ranked to surface real quality, not just review volume." />
  <link rel="stylesheet" href="style.css" />
  <!--
    AdSense loader — once your AdSense account is approved
    (google.com/adsense), uncomment this, replacing ca-pub-XXXXXXXXXXXXXXXX
    with your real publisher ID:

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    Also open AdSense > Privacy & messaging and turn on a GDPR/UK message —
    it generates a script snippet (Google-certified CMP) to paste here too,
    required before showing personalized ads to EEA/UK visitors.
  -->
</head>
<body>
  <header class="topbar">
    <h1><a href="/">Hungry<span class="brand-accent">Map</span></a></h1>
    <p class="tagline">Good food, fast, wherever you are.</p>
  </header>

  <main class="layout">
    <section class="controls" aria-label="Search filters">
      <div class="control-row">
        <label for="radius">Search radius</label>
        <select id="radius">
          <option value="402">5 min walk (0.25 mi)</option>
          <option value="805" selected>10 min walk (0.5 mi)</option>
          <option value="1609">20 min walk (1 mi)</option>
          <option value="4828">Short drive (3 mi)</option>
        </select>
      </div>

      <div class="control-row">
        <label for="minRating">Minimum rating</label>
        <select id="minRating">
          <option value="0">Any</option>
          <option value="3.5">3.5+</option>
          <option value="4" selected>4.0+</option>
          <option value="4.5">4.5+</option>
        </select>
      </div>

      <div class="control-row checkbox-row">
        <input type="checkbox" id="openNow" checked />
        <label for="openNow">Open now</label>
      </div>

      <button id="searchBtn">Find good food near me</button>
      <button id="enableLocationBtn" class="secondary-btn" type="button" hidden>Enable location access</button>

      <div class="control-row zip-row">
        <label for="zipInput">Or search by zip code</label>
        <div class="zip-input-group">
          <input type="text" id="zipInput" inputmode="numeric" autocomplete="postal-code" placeholder="e.g. 10001" />
          <button id="zipBtn" class="secondary-btn" type="button">Go</button>
        </div>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>

    <div id="map" class="map"></div>

    <section class="results" aria-label="Results">
      <ol id="resultsList" class="results-list"></ol>
    </section>
  </main>

  <div class="ad-slot" aria-label="Advertisement">
    <!--
      Uncomment once approved, filling in data-ad-client (your ca-pub-... id)
      and data-ad-slot (this unit's id from AdSense > Ads > By ad unit):

      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a>
  </footer>

  <script src="app.js"></script>
  <!--
    Replace YOUR_CLIENT_SIDE_KEY below with the restricted (HTTP-referrer-locked)
    Maps JavaScript API key — this one is safe to expose in the browser.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBTkyxo7QMyptUiJKWKXgaUO_1Z_XK7s6c&callback=initMap" async defer></script>
</body>
</html>
